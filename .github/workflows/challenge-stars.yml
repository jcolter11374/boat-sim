# Weather-challenge stars (Ravi, QA; Elena: this must pass before a challenge ships).
# Sails Sandy's shadow in its own weather (the ghost and fixed order sets), judges
# the stars against Sandy's NOAA best track (IBTrACS), and fails unless every star
# can be earned and the ghost alone never gets three. The artifact holds the table
# and Sandy's hourly centre for the page's goal chip.
# Run it by hand: Actions tab -> "Challenge stars" -> Run workflow.
name: Challenge stars
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/challenge-stars.yml"
      - "src/boatsim/sandbox/stars.py"
      - "tools/challenge_stars.py"
permissions:
  contents: read  # gh release download reads releases with this
# A new push to a pull request cancels that branch's older run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sandy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Download IBTrACS North Atlantic (about 58 MB)
        run: |
          curl -sSL --retry 3 --max-time 600 \
            "https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv/ibtracs.NA.list.v04r01.csv" -o ibtracs.csv
      - name: Sandy's weather bundle (challenge-data release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sea3d/public/challenges
          gh release download challenge-data -p challenge_sandys-shadow.npz -D sea3d/public/challenges --clobber
      - name: Sail and judge Sandy's shadow
        run: |
          set -o pipefail
          mkdir -p runs/stars
          python tools/challenge_stars.py sandys-shadow \
            --bundle sea3d/public/challenges/challenge_sandys-shadow.npz \
            --ibtracs ibtracs.csv --out runs/stars/sandys-shadow.json | tee runs/stars/sandys-shadow.md
          cat runs/stars/sandys-shadow.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge-stars
          path: runs/stars/
          retention-days: 90
