# Sandbox data on a pull request that changes the sandbox: the whole run in
# sandbox-run.yml except publishing, on the currents a main or hand-started run
# cached (no secrets: secret-using workflows never run on pull_request).
name: Sandbox data (PR)
on:
  pull_request:
    paths:
      - ".github/workflows/sandbox.yml"
      - ".github/workflows/sandbox-run.yml"
      - ".github/workflows/sandbox-pr.yml"
      - "src/boatsim/sandbox/**"
      - "tools/pyodide/**"
permissions:
  contents: read
concurrency:
  group: sandbox-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sandbox:
    uses: ./.github/workflows/sandbox-run.yml
    with:
      currents: cache
