# Gate for the 3D page's voyage replays (sea3d Phase 2): every committed replay
# (every boat) is re-simulated from its seed, four at a time, with that year's real weather and
# currents, and the build fails if anything differs from the file. A replay the
# simulator wouldn't produce today is stale; regenerate it with "Voyage replays".
# The cheap checks (well formed, right seed, today's drop point) run in CI on
# every PR (tests/test_voyage_files.py); the page-side check is in the sea3d
# smoke test. Owner: Ravi (QA).
# This file runs on pushes to main and by hand, with the Copernicus secrets, and
# caches the currents it fetched. Pull requests run replay-check-pr.yml: the
# same check on those cached currents, with no secrets (secret-using workflows
# never run on pull_request). The steps live in replay-check-run.yml. A weekly
# warm-only run restores the cache (refetching it if it was evicted) so a quiet
# week doesn't turn the PR gate red.
name: Replay check
on:
  push:
    branches: [main]
    paths:
      # After any simulator change lands, report whether the replays went stale.
      - "src/boatsim/**"
      - "configs/**"
      - "sea3d/public/voyages/**"
      - ".github/workflows/replay-check*.yml"
  schedule:
    - cron: "17 5 * * 1"  # Mondays: keep the currents cache warm for PR runs (warm only)
  workflow_dispatch:
    inputs:
      files:
        description: "Replay files to check (blank = every committed replay)"
        default: ""
permissions:
  contents: read
concurrency:
  group: replay-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/replay-check-run.yml
    with:
      files: ${{ inputs.files }}
      currents: fetch
      warm_only: ${{ github.event_name == 'schedule' }}
    secrets:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
