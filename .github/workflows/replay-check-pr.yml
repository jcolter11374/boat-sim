# Replay check on a pull request: the same bit-identical gate (see
# replay-check.yml) on the currents a main or hand-started run cached, with no
# secrets (secret-using workflows never run on pull_request). Owner: Ravi (QA).
name: Replay check (PR)
on:
  pull_request:
    paths:
      - "sea3d/public/voyages/**"
      # Any simulator or boat change, not only the replay writer: three changes on 14 Nov
      # (#529, #547, #552) each made replays stale, none ran this check, and main stayed red
      # for ten days (docs/qa/replay-check-regenerated-2026-11.md). One runner, about 11 min.
      # If your change is meant to alter voyages, this goes red: run "Voyage replays" on your
      # branch for each boat it names (commit ticked, one boat at a time), and it goes green.
      - "src/boatsim/**"
      - "configs/**"
      - ".github/workflows/replay-check.yml"
      - ".github/workflows/replay-check-run.yml"
      - ".github/workflows/replay-check-pr.yml"
permissions:
  contents: read
concurrency:
  group: replay-check-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/replay-check-run.yml
    with:
      currents: cache
