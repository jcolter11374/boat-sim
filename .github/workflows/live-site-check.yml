# Live-site end-to-end check: Playwright on GitHub's runners visits the DEPLOYED
# pages (https://jcolter11374.github.io/boat-sim/) in a fresh browser profile,
# like a first-time visitor, and fails on any console error, any "being
# updated" / "can't start" notice, or a launch that never sails a day.
# Runs after every Pages deploy, by hand, and on a pull request that changes it.
# Read-only: it only visits the public site. One job per check, so a slow or
# broken page doesn't hide the others; each job's table is in the run summary.
name: Live site check
on:
  workflow_run:
    workflows: ["3D sea page"]
    types: [completed]
  workflow_dispatch:
    inputs:
      site:
        description: "Site to check"
        default: "https://jcolter11374.github.io/boat-sim/"
  # No pull_request trigger: a PR that changes these checks is played by the
  # pre-release playtest (prerelease-playtest.yml), which runs the PR's own
  # tools/live_site_check.mjs against the PR's own build in Chrome and Firefox.
  # The 23-runner PR run here only replayed it against the old live site.
permissions:
  contents: read
concurrency:
  # A deploy of a pull request's page (skipped below) gets its own group, so it can't
  # cancel the real post-deploy check (it did at 16:45 on 11 Nov).
  group: live-site-check-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch != 'main' || github.event.workflow_run.event == 'pull_request') && format('skip-{0}', github.run_id) || github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: true
jobs:
  check:
    # After a deploy: only a successful run on main (that's the one that deployed).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Four runners, each playing every 4th check in one browser (SHARD in
        # tools/live_site_check.mjs). Was one runner per check: 23 runners per
        # deploy, each paying setup, a browser download and the 90 s wait, and
        # they filled the free plan's 20-runner limit, so PR gates queued behind them.
        shard: [1, 2, 3, 4]
    env:
      SITE: ${{ inputs.site || 'https://jcolter11374.github.io/boat-sim/' }}
    steps:
      # The checks from the commit that deployed, not main's newest: a workflow_run
      # checks out main's head, so a check added by the next merge failed against
      # the site deployed before it (12 Nov: sea-sail, run 43137338172). Only a
      # successful push run on main gets here (the if above), so it's main's code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The runner image already has the browsers' system libraries; --with-deps only adds
      # fonts from the Ubuntu mirrors, which can fail or hang on DNS (deploy 43047737622). Give it 2 min, then fall back.
      - run: |
          npm install --no-save playwright@1.49.1
          timeout 120 npx playwright install --with-deps chromium || npx playwright install chromium
      # Pages takes a minute to serve a fresh deploy everywhere.
      - if: github.event_name == 'workflow_run'
        run: sleep 90
      - run: node tools/live_site_check.mjs
        env:
          SHARD: ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-shard-${{ matrix.shard }}
          path: live-*.png
          if-no-files-found: ignore
