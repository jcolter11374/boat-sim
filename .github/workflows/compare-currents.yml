# Our currents (GLORYS12) against the Randolph team's source (SMOC, which
# Open-Meteo serves) on the Gulf Stream stretch both routes cross (#73).
# Uses the Copernicus secrets; GitHub masks them in logs.
name: Compare currents with SMOC
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/compare-currents.yml"
      - "src/boatsim/oceandata/currents_check.py"
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[data]' requests
      - name: Compare (6 dates in 2023, 0.25 degree grid, by 5 degree longitude band)
        run: python -m boatsim.oceandata compare-currents
      - uses: actions/upload-artifact@v4
        with:
          name: glorys-vs-smoc
          path: runs/currents/
          retention-days: 90
