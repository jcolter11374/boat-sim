# Land for the 3D views (src/boatsim/oceandata/landviews.py): Pico and Faial in
# the Azores, and the Annapolis waterfront. Heights from AWS Terrain Tiles,
# colour from a Sentinel-2 median, buildings and piers from Overture Maps
# (ODbL). Display only: nothing in the simulator reads them.
# Run it by hand: Actions tab -> "Land data" -> Run workflow. Tick "publish" to
# put the files on the land-data release; the 3D page's build (sea3d.yml) copies
# them into public/land/ when the release exists.
# No secrets: every source is a public AWS bucket. Free runners only.
name: Land data
on:
  workflow_dispatch:
    inputs:
      places:
        description: "Places (space separated)"
        default: "pico annapolis"
      overture_release:
        description: "Overture Maps release"
        default: "2026-10-21.0"
      publish:
        description: "Publish to the land-data release"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: landdata-${{ github.ref }}
  cancel-in-progress: false
env:
  PLACES: ${{ inputs.places }}
  OVERTURE: ${{ inputs.overture_release }}
jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # only for the publish step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . rasterio pyproj pyarrow shapely pillow scipy
      - name: Bake
        run: python -m boatsim.oceandata.landviews $PLACES --out site --overture-release "$OVERTURE"
      - name: Summary
        if: always()
        run: |
          {
            echo "| File | kB |"; echo "|---|---|"
            for f in site/*; do echo "| $(basename $f) | $(( $(stat -c %s $f) / 1000 )) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: land-data
          path: site/
          retention-days: 90
      - name: Publish to the land-data release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > NOTES.md <<EOF
          Land for the 3D views: Pico and Faial (Azores) and the Annapolis waterfront. Display only.
          Rebuilt by the Land data workflow; formats in src/boatsim/oceandata/landviews.py.

          Data sources (resampled by us):
          - Terrain: AWS Terrain Tiles (Mapzen/Tilezen; SRTM, GMTED2010, ETOPO1, USGS 3DEP and others, https://github.com/tilezen/joerd/blob/master/docs/attribution.md).
          - Colour (pico_colour.jpg): contains modified Copernicus Sentinel data 2023-2024 (Sentinel-2 L2A, via the Registry of Open Data on AWS).
          - Buildings and piers (annapolis.json): contains information from OpenStreetMap and Overture Maps Foundation (release $OVERTURE), available under the Open Database License (ODbL 1.0, https://opendatacommons.org/licenses/odbl/1-0/). annapolis.json is a derived database under the ODbL: anyone may use, share and adapt it, provided they credit the sources, keep it under the ODbL, and keep it open.
          EOF
          gh release view land-data >/dev/null 2>&1 || gh release create land-data \
            --title "Land data for the 3D views" --notes-file NOTES.md
          gh release edit land-data --notes-file NOTES.md
          gh release upload land-data site/* --clobber
