# Load the live Take the helm page in fresh Chromium and Firefox profiles and
# press "Take the helm", like a first-time visitor. Run by hand, or on a PR
# that changes this check. Read-only: it only visits the public site.
name: Live helm check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-helm-check.yml"
      - "tools/live_helm_check.mjs"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium firefox
      - run: node tools/live_helm_check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-helm-screens
          path: live-helm-*.png
