# Is the 2 km land mask right near the Bay mouth and Hampton Roads? (#11)
# Compares it with Natural Earth 1:10m and GSHHG full resolution. Thread
# sandboxes can't reach NOAA, so this runs here.
name: Check land mask near the Bay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/check-coast.yml"
      - "src/boatsim/oceandata/coast_check.py"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . shapely pyshp
      - name: Download Natural Earth 1:10m land and GSHHG
        run: |
          curl -sSL --retry 3 --max-time 300 -o ne_10m_land.geojson \
            "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_land.geojson"
          # GSHHG moved from NGDC to the NCEI archive (accession 0304143) in 2026.
          # Walk the archive's directory pages to find the shapefile zip.
          arc=https://www.ncei.noaa.gov/data/oceans/archive/arc0234/0304143/
          url=""
          queue="$arc"
          for _ in $(seq 1 30); do
            [ -z "$queue" ] && break
            d=${queue%% *}; queue=${queue#"$d"}; queue=${queue# }
            page=$(curl -fsSL --max-time 60 "$d" || true); echo "visit $d: $(echo "$page" | grep -o 'href="[^"?]*"' | cut -d\" -f2 | tr "\n" " " | cut -c1-300)"
            z=$(echo "$page" | grep -o 'href="gshhg-shp-[0-9.]*zip"' | head -1 | cut -d'"' -f2)
            if [ -n "$z" ]; then url="$d$z"; break; fi
            for sub in $(echo "$page" | grep -o 'href="[^"?/][^"]*/"' | cut -d'"' -f2); do queue="$queue $d$sub"; done
            queue=${queue# }
          done
          echo "GSHHG zip: ${url:-not found}"
          curl -fsSL --retry 3 --max-time 900 -o gshhg.zip "$url"
          unzip -o -q gshhg.zip 'GSHHS_shp/f/GSHHS_f_L1.*'
          ls -l ne_10m_land.geojson gshhg.zip GSHHS_shp/f/
      - name: Check
        run: >
          python -m boatsim.oceandata.coast_check
          --natural-earth ne_10m_land.geojson --gshhg GSHHS_shp/f/GSHHS_f_L1.shp
