# Is the 2 km land mask right near the Bay mouth and Hampton Roads? (#11)
# Compares it with Natural Earth 1:10m and GSHHG full resolution. Thread
# sandboxes can't reach NOAA, so this runs here.
name: Check land mask near the Bay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/check-coast.yml"
      - "src/boatsim/oceandata/coast_check.py"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . shapely pyshp
      - name: Download Natural Earth 1:10m land and GSHHG
        run: |
          curl -sSL --retry 3 --max-time 300 -o ne_10m_land.geojson \
            "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_land.geojson"
          for d in https://www.ngdc.noaa.gov/mgg/shorelines/ https://www.ngdc.noaa.gov/mgg/shorelines/data/ \
            https://www.ngdc.noaa.gov/mgg/shorelines/data/gshhg/ https://ngdc.noaa.gov/mgg/shorelines/data/gshhg/latest/ \
            https://www.ngdc.noaa.gov/mgg/shorelines/data/gshhs/latest/ https://www.ncei.noaa.gov/products/shorelines; do
            echo "$d -> $(curl -sSL -o page.html -w '%{http_code} %{url_effective}' --max-time 60 "$d")"
            grep -o 'href="[^"]*"' page.html | grep -i -E 'gshh|zip|shore' | head -15
          done
          base=https://www.ngdc.noaa.gov/mgg/shorelines/data/gshhg
          latest=$(curl -fsSL --max-time 60 "$base/latest/" | grep -o 'gshhg-shp-[0-9.]*zip' | head -1 || true)
          echo "latest listing: ${latest:-none}"
          for u in \
            ${latest:+$base/latest/$latest} \
            $base/oldversions/version2.3.7/gshhg-shp-2.3.7.zip \
            $base/oldversions/version2.3.6/gshhg-shp-2.3.6.zip; do
            echo "trying $u"
            curl -fsSL --retry 3 --max-time 600 -o gshhg.zip "$u" && unzip -tq gshhg.zip && break
            rm -f gshhg.zip
          done
          unzip -o -q gshhg.zip 'GSHHS_shp/f/GSHHS_f_L1.*'
          ls -l ne_10m_land.geojson gshhg.zip GSHHS_shp/f/
      - name: Check
        run: >
          python -m boatsim.oceandata.coast_check
          --natural-earth ne_10m_land.geojson --gshhg GSHHS_shp/f/GSHHS_f_L1.shp
