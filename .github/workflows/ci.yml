name: CI
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same PR cancels the older run (main runs all finish).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,data,reports]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m boatsim configs/v4_kayak.yaml
