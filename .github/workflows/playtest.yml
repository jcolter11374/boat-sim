# Nina's playtest, after each deploy: plays the deployed pages in Chrome and Firefox the way a
# person does (cinematic mode, "sail until something happens", base-station
# orders, Boatyard launch, race, leaderboard). Beside Ravi's live-site check.
# Read-only: it only visits the public site. Screenshots are in the artifacts.
name: Playtest
on:
  # Nightly against the live site, not after every deploy (John and the coordinator, 12 Nov:
  # deploys and pull requests mustn't wait for runners); Nina checks each deploy by hand.
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Site to play"
        default: "https://jcolter11374.github.io/boat-sim/"
      checks:
        description: "Checks to run, space-separated (empty: all). 'look' takes screenshots for the Creative Director. Split with '|' into up to 4 parts that run side by side; 'ALL' in a part means every non-manual check."
        default: ""
  # No pull_request trigger: the pre-release playtest (prerelease-playtest.yml)
  # plays a PR's own tools/playtest/play.mjs against the PR's own build.
permissions:
  contents: read
concurrency:
  # As in live-site-check.yml: a pull request's page build (skipped) must not cancel the real run.
  group: playtest-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch != 'main' || github.event.workflow_run.event == 'pull_request') && format('skip-{0}', github.run_id) || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: true
jobs:
  play:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        part: [1, 2, 3, 4]
    env:
      SITE: ${{ inputs.site || 'https://jcolter11374.github.io/boat-sim/' }}
      BROWSER: ${{ matrix.browser }}
    steps:
      # This part's checks: the part-th '|' segment of the input ('ALL': the whole default suite).
      - id: part
        env:
          ALLCHECKS: ${{ inputs.checks }}
          PART: ${{ matrix.part }}
        run: |
          if [[ "$ALLCHECKS" == *"|"* ]]; then seg=$(echo "$ALLCHECKS" | cut -d'|' -f"$PART" | xargs); [ -z "$seg" ] && { echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
          elif [ "$PART" != 1 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; else seg="$ALLCHECKS"; fi
          [ "$seg" = "ALL" ] && seg=""
          { echo "skip=0"; echo "checks=$seg"; } >> "$GITHUB_OUTPUT"
      # The playtest from the commit that deployed, not main's newest: a workflow_run
      # checks out main's head, so a check added by the next merge failed against
      # the site deployed before it (12 Nov: sea-sail, run 43137338172). Only a
      # successful push run on main gets here (the if above), so it's main's code.
      - if: steps.part.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.part.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The runner image already has the browsers' system libraries; --with-deps only adds
      # fonts from the Ubuntu mirrors, which can fail or hang on DNS (deploy 43047737622). Give it 2 min, then fall back.
      - if: steps.part.outputs.skip != '1'
        run: |
          npm install --no-save playwright@1.49.1
          timeout 120 npx playwright install --with-deps ${{ matrix.browser }} || npx playwright install ${{ matrix.browser }}
      - if: github.event_name == 'workflow_run'
        run: sleep 90
      # One job per browser, every check in turn (2 runners per deploy, not 26); each
      # check prints its own PASS/FAIL line and its row in the run summary.
      - if: steps.part.outputs.skip != '1'
        run: ${{ matrix.browser == 'firefox' && 'HEADED=1 xvfb-run -a' || '' }} node tools/playtest/play.mjs $CHECKS
        env:
          CHECKS: ${{ steps.part.outputs.checks }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.part.outputs.skip != '1'
        with:
          name: play-${{ matrix.browser }}-${{ matrix.part }}
          path: |
            play-*.png
            look-*.jpg
          if-no-files-found: ignore
