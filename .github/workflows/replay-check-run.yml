# The Replay check itself (called by replay-check.yml and replay-check-pr.yml;
# see replay-check.yml for what it checks). currents: "fetch" downloads the
# replay's GLORYS12 months with the Copernicus secrets and saves them to the
# Actions cache; "cache" (pull requests, no secrets) restores that cache and
# fails if it isn't there.
name: Replay check (run)
on:
  workflow_call:
    inputs:
      files: {type: string, default: ""}
      currents: {type: string, required: true}  # fetch | cache
      warm_only: {type: boolean, default: false}  # just keep the currents cache alive
    secrets:
      COPERNICUSMARINE_SERVICE_USERNAME: {required: false}
      COPERNICUSMARINE_SERVICE_PASSWORD: {required: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BOATSIM_REQUIRE_LAND: "1"
      BOATSIM_REQUIRE_SHIPS: "1"
      BOATSIM_NO_FETCH: "1"  # data is pre-fetched below, as in the replay run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[data]'
      - name: Pick the replay(s) and the data window
        id: pick
        env:
          FILES: ${{ inputs.files }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timedelta
          from pathlib import Path
          d = Path("sea3d/public/voyages")
          names = os.environ.get("FILES", "").split()
          if not names:
              # Every committed replay, every boat (#335: checking only the
              # shortest one let replays with a mid-voyage failure go stale).
              names = sorted(f.name for f in d.glob("voyage_*.json"))
          reps = [json.loads((d / n).read_text()) for n in names]
          if reps:
              t0 = min(datetime.fromisoformat(r["start"]) for r in reps)
              t1 = max(datetime.fromisoformat(r["end"]) for r in reps) + timedelta(days=5)
              print(f"files={' '.join(str(d / n) for n in names)}")
              print(f"era5_from={t0:%Y-%m-%d}\nera5_to={t1:%Y-%m-%d}")
              print(f"glorys_from={t0:%Y-%m}\nglorys_to={t1:%Y-%m}")
          EOF
          cat "$GITHUB_OUTPUT"
      # A restore also counts as use, so the weekly warm-only run keeps the cache
      # from being evicted (GitHub drops caches unused for 7 days).
      - name: Restore that window's currents (cached by a main or hand-started run)
        id: cur
        if: steps.pick.outputs.files != ''
        uses: actions/cache/restore@v4
        with:
          path: data/glorys
          key: glorys-${{ steps.pick.outputs.glorys_from }}-${{ steps.pick.outputs.glorys_to }}
          fail-on-cache-miss: ${{ inputs.currents == 'cache' }}  # PRs: run "Replay check" on main to fill it
      - name: Fetch that window's currents
        if: steps.pick.outputs.files != '' && inputs.currents == 'fetch' && steps.cur.outputs.cache-hit != 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python -m boatsim.oceandata fetch-glorys ${{ steps.pick.outputs.glorys_from }} ${{ steps.pick.outputs.glorys_to }}
      - name: Save the currents for pull-request runs
        if: steps.pick.outputs.files != '' && inputs.currents == 'fetch' && steps.cur.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true  # another run may have saved it first
        with:
          path: data/glorys
          key: glorys-${{ steps.pick.outputs.glorys_from }}-${{ steps.pick.outputs.glorys_to }}
      - name: Fetch that window's weather (public ERA5, no login)
        if: steps.pick.outputs.files != '' && !inputs.warm_only
        run: python -m boatsim.oceandata fetch-era5 ${{ steps.pick.outputs.era5_from }} ${{ steps.pick.outputs.era5_to }} --workers 4
      - name: Re-simulate and compare
        if: steps.pick.outputs.files != '' && !inputs.warm_only
        run: python -m boatsim.runner.replay verify --workers 4 ${{ steps.pick.outputs.files }}
