# Drift check (issue #19): races our simulated ocean against real NOAA drifters
# that started off Cape Hatteras and the Bay mouth. Needs real currents, so it
# runs here (thread sandboxes can't reach Copernicus Marine).
# Run it by hand: Actions tab -> "Drifter check" -> Run workflow. Hand-started
# only: secret-using workflows never run on pull_request.
# Reads the Copernicus login from the repo secrets; GitHub masks them in logs.
name: Drifter check
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days to drift (the dead-boat run uses 30 for #73)"
        default: "10"
      mode:
        description: "hatteras (#19 set), shared (36-42N 75-50W, #73), smoc (SMOC vs GLORYS, #116) or dead-boat (#73)"
        default: "hatteras"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      DAYS: ${{ inputs.days || '10' }}
      MODE: ${{ inputs.mode || 'hatteras' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[data]'
      - name: Check the login secrets exist
        run: |
          if [ -z "$COPERNICUSMARINE_SERVICE_USERNAME" ] || [ -z "$COPERNICUSMARINE_SERVICE_PASSWORD" ]; then
            echo "::error::Add the repo secrets COPERNICUSMARINE_SERVICE_USERNAME and COPERNICUSMARINE_SERVICE_PASSWORD first."
            exit 1
          fi
      - name: Drift the models alongside real drifters
        if: env.MODE != 'dead-boat' && env.MODE != 'smoc'
        run: python -m boatsim.mc.drifters --set "$MODE" --days "$DAYS" --out runs/drifters
      - name: Drift on GLORYS and on SMOC, side by side (#116)
        if: env.MODE == 'smoc'
        run: python -m boatsim.mc.drifters --set smoc --smoc --days "$DAYS" --out runs/drifters
      - name: Drift the dead kayak from the drop point (15 May 2023)
        if: env.MODE == 'dead-boat'
        run: python -m boatsim.mc.drifters --dead-boat --days "$DAYS" --out runs/drifters
      - name: Show the report on the run page
        if: always()
        run: |
          for f in runs/drifters/drift_report.md runs/drifters/dead_boat_report.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drifter-check
          path: runs/drifters/
          retention-days: 90
