# One-off measurement for #335: browser weather bundle cuts vs the full-data
# voyage replays, with download size, and the chaos floor. Runs on pushes to
# Ravi's branch only (it isn't meant for main); read the job summary.
name: Bundle accuracy
on:
  push:
    branches: [claude/project-thread-xe158v]
    paths:
      - ".github/workflows/bundle-accuracy.yml"
      - "tools/bundle_accuracy.py"
permissions:
  contents: read
concurrency:
  group: bundle-accuracy
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BOATSIM_REQUIRE_LAND: "1"
      BOATSIM_REQUIRE_SHIPS: "1"
      BOATSIM_NO_FETCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[data]'
      - name: Restore the season's currents (saved by Sandbox data on main)
        uses: actions/cache/restore@v4
        with:
          path: data/glorys
          key: glorys-2020-04-2020-11
          fail-on-cache-miss: true
      - name: Fetch weather (public ERA5, no login)
        run: python -m boatsim.oceandata fetch-era5 2020-04-01 2020-11-21 --workers 4
      - name: Measure
        run: python tools/bundle_accuracy.py --year 2020 --cuts 1.0:6:0.167 --out runs/bundle-accuracy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-accuracy
          path: runs/bundle-accuracy/bundle_accuracy.json
          if-no-files-found: ignore
