# Builds and checks the 3D sea page (sea3d/), and publishes it to GitHub Pages
# from main. Plan: phases 0-4, three.js in the browser, the Python simulator
# stays the referee.
#
# Pages needs one switch, once, by the repo owner:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until then the deploy job fails without affecting the build check.
name: 3D sea page
on:
  # Pull requests get the same build and tests (unit + smoke) in the pre-release
  # playtest (prerelease-playtest.yml), which plays that build too; building it
  # here as well doubled the work on every PR. A PR that changes this file still
  # runs it, so a broken deploy workflow shows up before it reaches main.
  pull_request:
    paths:
      - ".github/workflows/sea3d.yml"
  push:
    branches: [main]
    paths:
      - "sea3d/**"
      - ".github/workflows/sea3d.yml"
      # The simulator the pages run in the browser is packed here too, from the
      # same commit, so a simulator-only change redeploys the pages.
      - "src/boatsim/**"
      - "configs/**"
      - "data/land/**"
      - "tools/build_site.sh"
  workflow_dispatch:
permissions:
  contents: read
# Deploys queue: a run on main never cancels another (a merge deploy and the
# hand-started redeploy must not cut each other off halfway).
# Only superseded pull-request checks are cancelled.
concurrency:
  group: sea3d-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    # Blender boats (about 6 min when sea3d/blender changes) + the smoke test
    # went past 25 min, and a timed-out job never saves the boats cache, so every
    # deploy after #304 rebuilt them and timed out (11-12 Nov). The smoke test is
    # its own job now; the headroom stays for a Blender rebuild.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sea3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sea3d/package-lock.json
      - run: npm ci
      # The detailed boats (blender/build_*.py): Blender as a Python module,
      # headless. Cached on the scripts' hash, so they only rebuild when a
      # script changes. If it fails, the page falls back to the drawn-in-code boats.
      - name: Cache the Blender boats
        id: kayak-cache
        uses: actions/cache@v4
        with:
          path: |
            sea3d/public/models/kayak.glb
            sea3d/public/models/randolph.glb
            sea3d/public/models/shape_*.glb
            sea3d/public/models/stock_*.glb
          key: boats-glb-${{ hashFiles('sea3d/blender/**') }}
      - uses: actions/setup-python@v5
        if: steps.kayak-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
      - name: Build the boats with Blender
        if: steps.kayak-cache.outputs.cache-hit != 'true'
        continue-on-error: true # the page falls back to the drawn-in-code boats
        run: ../tools/build_boats.sh
      # The whole site from this commit, in one script shared with Nina's
      # pre-release playtest (tools/build_site.sh), so the gate plays exactly what
      # deploys: the data releases, the simulator (boatsim.zip) packed from THIS
      # commit, the page, and check-page, which fails before anything deploys if
      # the zip can't do what the pages ask or was packed from another commit.
      # boatsim.zip used to come from the sandbox-data release, which only a
      # hand-started run updated, and the pages got ahead of it three times
      # ("can't start from a port yet"). Numpy and PyYAML only, as in Pyodide.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site from this commit
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q numpy pyyaml
          tools/build_site.sh
      - name: Wave-motion gate (roll period, righting curves, self-righting)
        run: npm run test:unit
      # The smoke test runs in the next job, in two halves side by side, on this
      # exact build (as the pre-release gate does).
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: sea3d/dist
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sea3d/dist
  # Smoke test (animates, wave heights right, not blank, every page opens) on the
  # build above, in two halves (SMOKE_PART in smoke.mjs): about 18 min in one job
  # held every deploy for that long (Kai, 12 Nov). Deploy waits for both halves.
  # On main it is one job ("all"), both halves in turn: with PRs filling the account's
  # runners, each extra job waited 15-30 min for a slot, longer than the half it saves
  # (Maya, 12 Nov). Pull requests that change this file keep the two halves.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'pull_request' && '["1", "2"]' || '["all"]') }}
    defaults:
      run:
        working-directory: sea3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sea3d/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: sea3d/dist
      # --with-deps also apt-installs fonts and libraries, which fails whenever
      # the runner can't reach the Ubuntu mirrors (11 Nov: "Temporary failure
      # resolving security.ubuntu.com"). The runner image already has what
      # headless Chromium needs, so fall back to the browser alone. apt hangs
      # about 10 minutes on the failed lookups first, so give it 2 minutes.
      - name: Install headless browser for the smoke test
        run: |
          npm install --no-save playwright@1
          timeout 120 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Smoke test (animates, wave heights right, not blank)
        run: npm test
        env:
          SMOKE_PART: ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea3d-screenshots-${{ matrix.part }}
          path: sea3d/test-output/
          retention-days: 30
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # On the live site: the page's commit (version.json) and the simulator's
      # (boatsim.json beside the zip, and boatsim_build.json inside it) are the
      # same. Deploys queue, so a later one may already be live; what matters is
      # that page and simulator match. Pages' cache can lag a few minutes.
      - name: Live check - the deployed page and simulator are one commit
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 20); do
            q="?t=$(date +%s)"
            page=$(curl -fsS "${SITE}version.json$q" | jq -r .commit || true)
            beside=$(curl -fsS "${SITE}sandbox/boatsim.json$q" | jq -r .commit || true)
            curl -fsS -o boatsim.zip "${SITE}sandbox/boatsim.zip$q" || true
            inside=$(unzip -p boatsim.zip boatsim_build.json 2>/dev/null | jq -r .commit || true)
            echo "try $i: page $page, boatsim.json $beside, in the zip $inside (this run: $GITHUB_SHA)"
            if [ -n "$page" ] && [ "$page" = "$beside" ] && [ "$page" = "$inside" ]; then
              [ "$page" = "$GITHUB_SHA" ] || echo "::notice::a later deploy ($page) is already live; it matches its simulator"
              exit 0
            fi
            sleep 30
          done
          echo "::error::the live page and its simulator are from different commits"
          exit 1
