# Builds and checks the 3D sea page (sea3d/), and publishes it to GitHub Pages
# from main. Plan: phases 0-4, three.js in the browser, the Python simulator
# stays the referee.
#
# Pages needs one switch, once, by the repo owner:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until then the deploy job fails without affecting the build check.
name: 3D sea page
on:
  pull_request:
    paths:
      - "sea3d/**"
      - ".github/workflows/sea3d.yml"
  push:
    branches: [main]
    paths:
      - "sea3d/**"
      - ".github/workflows/sea3d.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sea3d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sea3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sea3d/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Wave-motion gate (roll period, righting curves, self-righting)
        run: npm run test:unit
      - name: Install headless browser for the smoke test
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Smoke test (animates, wave heights right, not blank)
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea3d-screenshots
          path: sea3d/test-output/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sea3d/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
