# Builds and checks the 3D sea page (sea3d/), and publishes it to GitHub Pages
# from main. Plan: phases 0-4, three.js in the browser, the Python simulator
# stays the referee.
#
# Pages needs one switch, once, by the repo owner:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until then the deploy job fails without affecting the build check.
name: 3D sea page
on:
  pull_request:
    paths:
      - "sea3d/**"
      - ".github/workflows/sea3d.yml"
  push:
    branches: [main]
    paths:
      - "sea3d/**"
      - ".github/workflows/sea3d.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sea3d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sea3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sea3d/package-lock.json
      - run: npm ci
      # The detailed boats (blender/build_*.py): Blender as a Python module,
      # headless. Cached on the scripts' hash, so they only rebuild when a
      # script changes. If it fails, the page falls back to the drawn-in-code boats.
      - name: Cache the Blender boats
        id: kayak-cache
        uses: actions/cache@v4
        with:
          path: |
            sea3d/public/models/kayak.glb
            sea3d/public/models/randolph.glb
          key: boats-glb-${{ hashFiles('sea3d/blender/**') }}
      - uses: actions/setup-python@v5
        if: steps.kayak-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
      - name: Build the boats with Blender
        if: steps.kayak-cache.outputs.cache-hit != 'true'
        continue-on-error: true # the page falls back to the drawn-in-code boats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 > /dev/null
          pip install -q bpy==4.2.0 pillow numpy
          python blender/build_kayak.py public/models/kayak.glb
          python blender/build_randolph.py public/models/randolph.glb
      # The Boatyard's simulator in the browser (docs/sandbox.md): Theo's
      # boatsim.zip and the 2020 weather, served from this site so the page can
      # fetch them (a release download can't be read from a browser page). If
      # the release isn't there, the yard launches from the precomputed grid.
      - name: Fetch the Boatyard sandbox files
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download sandbox-data -R "$GITHUB_REPOSITORY" -D public/sandbox -p boatsim.zip -p forcing_2020.npz \
            && ls -l public/sandbox || echo "no sandbox-data release yet: the yard uses the grid"
      - name: Type-check and build
        run: npm run build
      - name: Wave-motion gate (roll period, righting curves, self-righting)
        run: npm run test:unit
      - name: Install headless browser for the smoke test
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Smoke test (animates, wave heights right, not blank)
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea3d-screenshots
          path: sea3d/test-output/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sea3d/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
