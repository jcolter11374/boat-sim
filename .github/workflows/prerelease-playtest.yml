# Pre-release playtest: the blocking gate before anything reaches the live site.
# Builds the WHOLE site from the pull request's own commit with the script the
# Pages deploy runs (tools/build_site.sh: page + simulator boatsim.zip packed
# from the same commit + the published data releases), serves it on localhost
# on the runner, and plays it in Chrome and Firefox: Ravi's live-site checks
# (tools/live_site_check.mjs) and Nina's playtest (tools/playtest/play.mjs). A red run means the PR would break
# the live game. The post-deploy "Live site check" is the second gate.
# It also runs the page's own tests on the same build: the unit tests (wave
# motion, righting curves, ...) and the Chromium smoke test (sea3d/tests/smoke.mjs).
# Those used to run in the "3D sea page" workflow on every PR too, which built
# the same site a second time; that workflow now only builds on main (deploy).
# No secrets: it only reads public releases and serves on the runner itself.
#
# Merge fast, test the whole game nightly (John and the coordinator, 12 Nov). A pull
# request gets the fast gate only, about 5-8 min: the build (typecheck + unit tests)
# and "quick" (tests/quick.mjs: every page opens, the sea and a replay animate, Real
# time is on every speed bar). The full suite (both smoke halves, both browsers'
# live checks and playtests) runs nightly on main and on a hand dispatch. After each
# deploy Nina checks the live site by hand; anything broken is reverted.
name: Pre-release playtest
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC, about 2-3 AM in Maryland
  pull_request:
    paths:
      - "sea3d/**"
      - "src/boatsim/**"
      - "tools/playtest/**"
      - "tools/build_site.sh"
      - "configs/**"
      - "data/land/**"
      - "tools/build_boats.sh"
      - "tools/live_site_check.mjs"
      - "tools/live_visual_checks.mjs"
      - ".github/workflows/prerelease-playtest.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prerelease-playtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sea3d/package-lock.json
      # The detailed Blender boats: the deploy's cache when sea3d/blender is
      # unchanged, otherwise built here with the deploy's own script, so a PR that
      # changes a boat plays its new boats (Iris's #304 got 404s without this).
      # Before Python 3.12 is set up for the simulator: bpy 4.2 needs 3.11.
      - name: Cache the Blender boats
        id: boats-cache
        uses: actions/cache@v4
        with:
          path: |
            sea3d/public/models/kayak.glb
            sea3d/public/models/randolph.glb
            sea3d/public/models/shape_*.glb
            sea3d/public/models/stock_*.glb
          key: boats-glb-${{ hashFiles('sea3d/blender/**') }}
      - uses: actions/setup-python@v5
        if: steps.boats-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
      - name: Build the boats with Blender
        if: steps.boats-cache.outputs.cache-hit != 'true'
        continue-on-error: true # as in the deploy: the page falls back to the drawn-in-code boats
        run: tools/build_boats.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build the site from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/build_site.sh
      - name: Wave-motion gate (roll period, righting curves, self-righting)
        working-directory: sea3d
        run: npm run test:unit
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: sea3d/dist
          retention-days: 3
  # The page's smoke test (animates, wave heights right, not blank, every page
  # opens), as the deploy used to run it on PRs, on this run's build.
  # Two halves side by side (SMOKE_PART in smoke.mjs): it was 18 min in one job,
  # the gate's longest.
  # The fast pre-merge browser check (every PR): a few minutes in Chromium.
  quick:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sea3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sea3d/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: sea3d/dist
      - run: |
          npm install --no-save playwright@1
          timeout 120 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Quick smoke (pages open, animate, Real time on every speed bar)
        run: npm run test:quick
  # The full suite: nightly on main and on a hand dispatch, not on pull requests.
  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    defaults:
      run:
        working-directory: sea3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sea3d/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: sea3d/dist
      - run: |
          npm install --no-save playwright@1
          timeout 120 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Smoke test (animates, wave heights right, not blank)
        run: npm test
        env:
          SMOKE_PART: ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea3d-screenshots-${{ matrix.part }}
          path: sea3d/test-output/
          retention-days: 30
  play:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Two at a time (Maya, 12 Nov): one PR's four play jobs used to take four of the
      # account's runners at once, and main's deploy waited behind them. Every job still runs.
      max-parallel: 2
      matrix:
        browser: [chromium, firefox]
        suite: [live-check, playtest]
    env:
      SITE: http://localhost:4173/
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The runner image already has the browsers' system libraries; --with-deps only adds
      # fonts from the Ubuntu mirrors, which can fail or hang on DNS (deploy 43047737622). Give it 2 min, then fall back.
      - run: |
          npm install --no-save playwright@1.49.1
          timeout 120 npx playwright install --with-deps ${{ matrix.browser }} || npx playwright install ${{ matrix.browser }}
      - name: Serve the site on localhost
        run: |
          (cd site && python3 -m http.server 4173 > ../server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf "$SITE" > /dev/null && break; sleep 1; done
          curl -sf "$SITE" > /dev/null
      - name: Ravi's live-site checks
        if: matrix.suite == 'live-check'
        run: ${{ matrix.browser == 'firefox' && 'HEADED=1 xvfb-run -a' || '' }} node tools/live_site_check.mjs
      - name: Nina's playtest
        if: matrix.suite == 'playtest'
        run: ${{ matrix.browser == 'firefox' && 'HEADED=1 xvfb-run -a' || '' }} node tools/playtest/play.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.browser }}-${{ matrix.suite }}
          path: |
            live-*.png
            play-*.png
          if-no-files-found: ignore
